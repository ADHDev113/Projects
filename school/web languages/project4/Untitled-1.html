<!DOCTYPE HTML>
<html lang="en-US">
    <head>
        <title>Dice Roller</title>
        <meta charset="utf-8">
        <link href="stylesheet.css" rel="stylesheet"> 
    </head>
    <body>
        <h1>Pick a die to roll</h1>
        <br><br><br>
        <div id="dice">
            <div id="d20" class = "die" data-size="20">20</div>
            <div id="d12" class = "die" data-size="12">12</div>
            <div id="d10" class = "die" data-size="10">10</div>
            <div id="d8" class = "die" data-size="8">8</div>
            <div id="d6" class = "die" data-size="6">6</div>
            <div id="d4" class = "die" data-size="4">4</div>
        </div>
        <script src="script.js"></script>
    </body>
